
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Norgeskart LA og RH | Luftambulansekoordinator</title>

  <!-- FELLES STIL -->
  <link rel="stylesheet" href="../felles/felles.css">

  <!-- KARTETS STIL -->
  <link rel="stylesheet" href="la kart/la kart.css">

  <!-- FELLES FUNKSJONER -->
  <script src="../felles/felles.js" defer></script>
  <script src="../felles/meny.js" defer></script>

  <!-- ZOOM OG FLYTTING -->
  <script src="la kart/la-kart-zoom.js" defer></script>
</head>

<body class="kart-side">

  <!-- TOPPFELT -->
  <header class="app-header">
    <div>
      <p class="app-eyebrow">Luftambulansekoordinator</p>
      <h1>Norgeskart LA og RH</h1>
    </div>

    <button
      type="button"
      id="themeToggle"
      class="theme-toggle"
      aria-pressed="false"
      aria-label="Slå på kveldsmodus"
    >
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle-text">Kveldsmodus</span>
    </button>
  </header>

  <!-- HOVEDLAYOUT -->
  <main class="app-shell kart-layout">

    <!-- FELLES VENSTREMENY -->
    <aside class="kart-sidebar">
      <div id="shared-menu"></div>
    </aside>

    <!-- KARTPANEL -->
    <section class="kart-panel" aria-label="Norgeskart">

      <div class="kart-panel-inner">

        <!-- ZOOMBART KART -->
        <div
          class="kart-viewport"
          id="kartViewport"
          aria-label="Interaktivt kart over luftambulanse- og redningshelikopterbaser"
        >
          <img
            src="../img/la-og-rh-norgeskart.jpg"
            alt="Norgeskart med luftambulanse- og redningshelikopterbaser"
            class="kart-bilde"
            id="kartBilde"
            draggable="false"
          >
        </div>

      </div>

    </section>

  </main>

</body>
</html>
