
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Norgeskart LA og RH | Luftambulansekoordinator</title>

  <link rel="stylesheet" href="../felles/felles.css">
  <link rel="stylesheet" href="la kart.css">

  <script src="../felles/felles.js" defer></script>
  <script src="../felles/meny.js" defer></script>
  <script src="la-kart-zoom.js" defer></script>
</head>

<body class="kart-side">

  <header class="app-header">
    <div>
      <p class="app-eyebrow">Luftambulansekoordinator</p>
      <h1>Norgeskart LA og RH</h1>
    </div>

    <button
      type="button"
      id="themeToggle"
      class="theme-toggle"
      aria-pressed="false"
      aria-label="Slå på kveldsmodus"
    >
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle-text">Kveldsmodus</span>
    </button>
  </header>

  <main class="app-shell kart-layout">


<!-- FELLES VENSTREMENY -->
<aside class="kart-sidebar">
  <div id="shared-menu"></div>
</aside>


<!-- KARTOMRÅDE -->
<section class="kart-panel" aria-label="Norgeskart">

  <div class="kart-panel-inner">

    <!-- VERKTØYLINJE -->
    <div class="kart-toolbar">

      <span class="kart-toolbar-title">
        Norgeskart LA og RH
      </span>

      <div class="kart-controls">

        <button type="button" id="zoomOut"
          class="kart-control-btn"
          aria-label="Zoom ut"
          title="Zoom ut">
          −
        </button>

        <span id="zoomLevel" class="kart-zoom-level">
          100 %
        </span>

        <button type="button" id="zoomIn"
          class="kart-control-btn"
          aria-label="Zoom inn"
          title="Zoom inn">
          +
        </button>

        <button type="button" id="zoomReset"
          class="kart-control-btn kart-reset-btn"
          title="Vis hele kartet">
          Tilbakestill
        </button>

      </div>

    </div>

    <!-- ZOOMBART KART -->
    <div class="kart-viewport" id="kartViewport">

      <img
        src="../img/la-og-rh-norgeskart.jpg"
        alt="Norgeskart med luftambulanse- og redningshelikopterbaser"
        class="kart-bilde"
        id="kartBilde"
        draggable="false"
      >

    </div>

    <p class="kart-hint">
      Bruk musehjulet for å zoome.
      Hold museknappen inne for å flytte kartet.
    </p>

  </div>

</section>

  </main>

</body>
</html>
