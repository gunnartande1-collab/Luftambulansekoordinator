
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flight Following | Luftambulansekoordinator</title>

  <link rel="stylesheet" href="../felles/felles.css">
  <link rel="stylesheet" href="flight following.css">

  <script src="../felles/felles.js" defer></script>
  <script src="../felles/meny.js" defer></script>
  <script src="flight following.js" defer></script>
</head>

<body class="ff-page">

  <header class="app-header">
    <div class="app-header-content">
      <p class="app-eyebrow">LUFTAMBULANSEKOORDINATOR</p>
      <h1>Flight Following</h1>
    </div>

    <button
      type="button"
      id="themeToggle"
      class="theme-toggle"
      aria-pressed="false"
      aria-label="Slå på kveldsmodus">

      <span class="theme-toggle-icon" aria-hidden="true">
        🌙
      </span>

      <span class="theme-toggle-text">
        Kveldsmodus
      </span>
    </button>
  </header>

  <main class="ff-layout">

    <!-- FELLES VENSTREMENY -->
    <aside id="shared-menu"></aside>

    <!-- REGISTRERING -->
    <section class="ff-main"
             aria-label="Flight Following-registrering">



<div class="ff-toolbar">

  <button
    type="button"
    id="printActiveBtn"
    class="ff-btn ff-neutral">
    Skriv ut aktive FF
  </button>

  <button
    type="button"
    id="printBlankBtn"
    class="ff-btn ff-neutral">
    Skriv ut tom FF
  </button>

  <a
    class="ff-btn ff-neutral ff-procedure-btn"
    href="https://ehandbok.ous-hf.no/document/144258"
    target="_blank"
    rel="noopener noreferrer"
    title="Åpne prosedyre for Flight Following">
    Prosedyre
  </a>

</div>

      <section
        id="ffAlarmPanel"
        class="ff-alarm-panel"
        aria-label="Manglende landingsbekreftelse"
        aria-live="assertive"
        hidden>
      </section>

      <div id="ffContainer" class="ff-container">
        <div class="ff-empty">
          <strong>Ingen ressurs valgt</strong>
          <p>
            Opprett en ny Flight Following eller velg
            en ressurs fra oversikten til høyre.
          </p>
        </div>
      </div>

    </section>

    <!-- ALLTID TILGJENGELIG HØYREPANEL -->
    <aside class="ff-sidebar"
           aria-label="Aktiv Flight Following">

      <div class="ff-sidebar-top">

        <div class="ff-sidebar-heading">
          <div>
            <h2>Aktiv Flight Following</h2>
            <p>Alle registrerte ressurser</p>
          </div>

          <span id="ffActiveCount"
                class="ff-total-count">0</span>
        </div>

        <button
          type="button"
          id="newFFBtn"
          class="ff-btn ff-primary ff-new-button">
          + Ny Flight Following
        </button>

      </div>

      <div
        id="ffOverview"
        class="ff-overview">
      </div>

    </aside>

  </main>

  <!-- NY FLIGHT FOLLOWING -->
  <dialog id="newFFDialog" class="ff-dialog">
    <form id="newFFForm">

      <h2>Ny Flight Following</h2>

      <label for="resourceInput">Ressurs-ID</label>

      <input
        id="resourceInput"
        type="text"
        maxlength="40"
        placeholder="F.eks. 1-1"
        autocomplete="off"
        required>

      <div class="ff-dialog-buttons">
        <button
          type="button"
          id="cancelNewFFBtn"
          class="ff-btn ff-neutral">
          Avbryt
        </button>

        <button
          type="submit"
          class="ff-btn ff-primary">
          Opprett FF
        </button>
      </div>

    </form>
  </dialog>

  <!-- REGISTRER LANDING -->
  <dialog id="landFFDialog" class="ff-dialog">
    <form id="landFFForm">

      <h2>Registrer landing</h2>
      <p id="landFFText"></p>

      <label for="landTimeInput">
        Landingstidspunkt
      </label>

      <input
        id="landTimeInput"
        type="datetime-local"
        required>

      <div class="ff-dialog-buttons">
        <button
          type="button"
          id="cancelLandFFBtn"
          class="ff-btn ff-neutral">
          Avbryt
        </button>

        <button
          type="submit"
          class="ff-btn ff-land">
          Bekreft landing
        </button>
      </div>

    </form>
  </dialog>

  <!-- AVSLUTT FF -->
  <dialog id="endFFDialog" class="ff-dialog">

    <h2>Avslutt Flight Following?</h2>
    <p id="endFFText"></p>

    <div class="ff-dialog-buttons">
      <button
        type="button"
        id="cancelEndFFBtn"
        class="ff-btn ff-neutral">
        Avbryt
      </button>

      <button
        type="button"
        id="confirmEndFFBtn"
        class="ff-btn ff-danger">
        Avslutt FF
      </button>
    </div>

  </dialog>

  <div id="printArea"></div>

</body>
</html>
