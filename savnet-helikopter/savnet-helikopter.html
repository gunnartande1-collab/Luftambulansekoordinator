<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Savnet helikopter | Luftambulansekoordinator</title>

    <link
        rel="stylesheet"
        href="../css/savnet-helikopter.css"
    >
</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="app-header">

        <p class="app-eyebrow">
            Luftambulansekoordinator
        </p>

        <h1>

            <span>Savnet helikopter</span>

        </h1>

    </header>


    <!-- =====================================================
         HOVEDLAYOUT
         VENSTRE MENY | SKJEMA | RAPPORT
         ===================================================== -->

    <main class="app-shell">


        <!-- =================================================
             VENSTRE MENY
             ================================================= -->

        <nav
            class="form-navigation"
            aria-label="Skjemaer"
        >

            <div class="form-navigation-inner">


                <p class="form-navigation-label">
                    Skjemaer
                </p>


                <ul class="form-nav-list">


                    <!-- FREMSIDE -->

                    <li>

                        <a
                            href="../index.html"
                            class="form-nav-link"
                        >

                            <span
                                class="form-nav-icon"
                                aria-hidden="true"
                            >
                                🏠
                            </span>

                            <span class="form-nav-copy">

                                <span>
                                    Fremside
                                </span>

                            </span>

                        </a>

                    </li>


                    <!-- SAVNET HELIKOPTER -->

                    <li>

                        <a
                            href="savnet-helikopter.html"
                            class="form-nav-link"
                            aria-current="page"
                        >

                            <span
                                class="form-nav-icon"
                                aria-hidden="true"
                            >
                                🚁
                            </span>

                            <span class="form-nav-copy">

                                <span>
                                    Savnet helikopter
                                </span>

                            </span>

                        </a>

                    </li>


                    <!-- GPS FORSTYRRELSER -->

                    <li>

                        <a
                            href="gps-forstyrrelser.html"
                            class="form-nav-link"
                        >

                            <span
                                class="form-nav-icon"
                                aria-hidden="true"
                            >
                                📡
                            </span>

                            <span class="form-nav-copy">

                                <span>
                                    GPS-forstyrrelser
                                </span>

                            </span>

                        </a>

                    </li>


                </ul>

            </div>

        </nav>



        <!-- =================================================
             SKJEMA
             ================================================= -->

        <div class="form-panel">

            <form
                id="missingHelicopterForm"
                autocomplete="off"
            >


                <!-- =========================================
                     1. TALEGRUPPER
                     ========================================= -->

                <section
                    class="form-section"
                    id="talegrupper"
                >

                    <h2>
                        Talegrupper
                    </h2>


                    <div class="tg-grid">


                        <!-- NØDNETT -->

                        <div class="field-card">

                            <label for="tgEmergency">
                                Nødnett
                            </label>

                            <input
                                type="text"
                                id="tgEmergency"
                                name="tgEmergency"
                                placeholder="Talegruppe"
                            >

                        </div>


                        <!-- SAMBAND -->

                        <div class="field-card">

                            <label for="tgSamband">
                                Samband
                            </label>

                            <input
                                type="text"
                                id="tgSamband"
                                name="tgSamband"
                                placeholder="Talegruppe"
                            >

                        </div>


                        <!-- ANNEN TALEGRUPPE -->

                        <div class="field-card">

                            <label for="tgOther">
                                Annen talegruppe
                            </label>

                            <input
                                type="text"
                                id="tgOther"
                                name="tgOther"
                                placeholder="Talegruppe"
                            >

                        </div>

                    </div>

                </section>



                <!-- =========================================
                     2. POSISJON
                     ========================================= -->

                <section
                    class="form-section"
                    id="posisjon"
                >

                    <h2>
                        Posisjon
                    </h2>


                    <div class="form-grid form-grid-2">


                        <!-- SIST KJENTE POSISJON -->

                        <div class="form-field">

                            <label for="lastKnownPosition">
                                Sist kjente posisjon
                            </label>

                            <input
                                type="text"
                                id="lastKnownPosition"
                                name="lastKnownPosition"
                                placeholder="Grader og desimalminutter"
                            >

                        </div>


                        <!-- STED / OMRÅDE -->

                        <div class="form-field">

                            <label for="positionArea">
                                Sted / område
                            </label>

                            <input
                                type="text"
                                id="positionArea"
                                name="positionArea"
                                placeholder="Stedsnavn eller område"
                            >

                        </div>

                    </div>


                    <div class="form-grid form-grid-3">


                        <!-- HØYDE -->

                        <div class="form-field">

                            <label for="altitude">
                                Høyde
                            </label>

                            <input
                                type="number"
                                id="altitude"
                                name="altitude"
                                min="0"
                                placeholder="Høyde"
                            >

                        </div>


                        <!-- HØYDEENHET -->

                        <div class="form-field">

                            <span class="field-label">
                                Enhet
                            </span>

                            <div
                                class="chip-group"
                                id="altitudeUnitChips"
                            >

                                <button
                                    type="button"
                                    class="chip"
                                    data-value="FT"
                                >
                                    FT
                                </button>

                                <button
                                    type="button"
                                    class="chip"
                                    data-value="M"
                                >
                                    M
                                </button>

                            </div>

                            <input
                                type="hidden"
                                id="altitudeUnit"
                                name="altitudeUnit"
                            >

                        </div>


                        <!-- HØYDEREFERANSE -->

                        <div class="form-field">

                            <span class="field-label">
                                Referanse
                            </span>

                            <div
                                class="chip-group"
                                id="altitudeReferenceChips"
                            >

                                <button
                                    type="button"
                                    class="chip"
                                    data-value="MSL"
                                >
                                    MSL
                                </button>

                                <button
                                    type="button"
                                    class="chip"
                                    data-value="AGL"
                                >
                                    AGL
                                </button>

                            </div>

                            <input
                                type="hidden"
                                id="altitudeReference"
                                name="altitudeReference"
                            >

                        </div>

                    </div>


                    <!-- TIDSPUNKT SIST POSISJON -->

                    <div class="form-field">

                        <label for="lastPositionTime">
                            Tidspunkt for sist kjente posisjon
                        </label>

                        <input
                            type="text"
                            id="lastPositionTime"
                            name="lastPositionTime"
                            placeholder="TT:MM"
                            maxlength="5"
                            inputmode="numeric"
                        >

                    </div>

                </section>



                <!-- =========================================
                     3. CREX MANIFEST
                     ========================================= -->

                <section
                    class="form-section"
                    id="crex-manifest"
                >

                    <h2>
                        CREX manifest
                    </h2>


                    <!-- POB TOTALT -->

                    <div class="form-field">

                        <span class="field-label">
                            POB – totalt
                        </span>


                        <div
                            class="chip-group"
                            id="pobTotalChips"
                            role="group"
                            aria-label="Velg totalt antall personer om bord"
                        >

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="1"
                            >
                                1
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="2"
                            >
                                2
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="3"
                            >
                                3
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="4"
                            >
                                4
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="5"
                            >
                                5
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="6"
                            >
                                6
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="7"
                            >
                                7
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="8"
                            >
                                8
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="9"
                            >
                                9
                            </button>

                            <button
                                type="button"
                                class="chip pob-chip"
                                data-value="10"
                            >
                                10
                            </button>

                        </div>


                        <input
                            type="hidden"
                            id="pobTotal"
                            name="pobTotal"
                        >

                    </div>



                    <!-- LUFTFARTØY -->

                    <div class="form-grid form-grid-3">


                        <!-- RESSURS-ID -->

                        <div class="form-field">

                            <label for="resourceId">
                                Ressurs-ID
                            </label>

                            <input
                                type="text"
                                id="resourceId"
                                name="resourceId"
                                placeholder="F.eks. LA1"
                            >

                        </div>


                        <!-- REGISTRERINGSNUMMER -->

                        <div class="form-field">

                            <label for="registration">
                                Reg.nr.
                            </label>

                            <input
                                type="text"
                                id="registration"
                                name="registration"
                                placeholder="F.eks. LN-OOA"
                            >

                        </div>


                        <!-- CALLSIGN -->

                        <div class="form-field">

                            <label for="callsign">
                                Callsign
                            </label>

                            <input
                                type="text"
                                id="callsign"
                                name="callsign"
                                placeholder="Callsign"
                            >

                        </div>

                    </div>



                    <!-- PILOT -->

                    <div class="person-row">

                        <div class="person-role">

                            <img
                                src="../img/pilot.svg"
                                alt=""
                                aria-hidden="true"
                            >

                            <span>
                                Pilot
                            </span>

                        </div>


                        <input
                            type="text"
                            id="pilotName"
                            name="pilotName"
                            placeholder="Navn"
                        >


                        <input
                            type="text"
                            id="pilotPhone"
                            name="pilotPhone"
                            placeholder="Telefon"
                            inputmode="tel"
                        >

                    </div>



                    <!-- REDNINGSMANN -->

                    <div class="person-row">

                        <div class="person-role">

                            <img
                                src="../img/redningsmann.svg"
                                alt=""
                                aria-hidden="true"
                            >

                            <span>
                                Redningsmann
                            </span>

                        </div>


                        <input
                            type="text"
                            id="rescuerName"
                            name="rescuerName"
                            placeholder="Navn"
                        >


                        <input
                            type="text"
                            id="rescuerPhone"
                            name="rescuerPhone"
                            placeholder="Telefon"
                            inputmode="tel"
                        >

                    </div>



                    <!-- LEGE -->

                    <div class="person-row">

                        <div class="person-role">

                            <img
                                src="../img/lege.svg"
                                alt=""
                                aria-hidden="true"
                            >

                            <span>
                                Lege
                            </span>

                        </div>


                        <input
                            type="text"
                            id="doctorName"
                            name="doctorName"
                            placeholder="Navn"
                        >


                        <input
                            type="text"
                            id="doctorPhone"
                            name="doctorPhone"
                            placeholder="Telefon"
                            inputmode="tel"
                        >

                    </div>



                    <!-- PAX -->

                    <div class="person-row">

                        <div class="person-role">

                            <img
                                src="../img/pax.svg"
                                alt=""
                                aria-hidden="true"
                            >

                            <span>
                                PAX
                            </span>

                        </div>


                        <input
                            type="text"
                            id="paxName"
                            name="paxName"
                            placeholder="Navn / beskrivelse"
                        >


                        <input
                            type="text"
                            id="paxPhone"
                            name="paxPhone"
                            placeholder="Telefon"
                            inputmode="tel"
                        >

                    </div>

                </section>



                <!-- =========================================
                     4. FLYRUTE
                     ========================================= -->

                <section
                    class="form-section"
                    id="flyrute"
                >

                    <h2>
                        Flyrute
                    </h2>


                    <!-- FRA / TIL -->

                    <div class="form-grid form-grid-2">


                        <div class="form-field">

                            <label for="flightFrom">
                                Fra
                            </label>

                            <input
                                type="text"
                                id="flightFrom"
                                name="flightFrom"
                                placeholder="Fra"
                            >

                        </div>


                        <div class="form-field">

                            <label for="flightTo">
                                Til
                            </label>

                            <input
                                type="text"
                                id="flightTo"
                                name="flightTo"
                                placeholder="Til"
                            >

                        </div>

                    </div>


                    <!-- BESKRIVELSE -->

                    <div class="form-field">

                        <label for="flightDescription">
                            Beskrivelse
                        </label>

                        <textarea
                            id="flightDescription"
                            name="flightDescription"
                            rows="3"
                            placeholder="Beskrivelse av flyruten"
                        ></textarea>

                    </div>


                    <!-- TATT AV / ETA -->

                    <div class="form-grid form-grid-2">


                        <div class="form-field">

                            <label for="takeoffTime">
                                Tatt av
                            </label>

                            <input
                                type="text"
                                id="takeoffTime"
                                name="takeoffTime"
                                placeholder="TT:MM"
                                maxlength="5"
                                inputmode="numeric"
                            >

                        </div>


                        <div class="form-field">

                            <label for="eta">
                                ETA
                            </label>

                            <input
                                type="text"
                                id="eta"
                                name="eta"
                                placeholder="TT:MM"
                                maxlength="5"
                                inputmode="numeric"
                            >

                        </div>

                    </div>

                </section>



                <!-- =========================================
                     5. UTLØSENDE KRITERIUM
                     ========================================= -->

                <section
                    class="form-section"
                    id="utlosende-kriterium"
                >

                    <h2>
                        Utløsende kriterium
                    </h2>


                    <div
                        class="criteria-list"
                        id="criteriaList"
                    >


                        <button
                            type="button"
                            class="criteria-chip"
                            data-value="Manglende samband"
                        >
                            Manglende samband
                        </button>


                        <button
                            type="button"
                            class="criteria-chip"
                            data-value="Manglende flight following"
                        >
                            Manglende flight following / posisjonsoppdatering
                        </button>


                        <button
                            type="button"
                            class="criteria-chip"
                            data-value="Ikke ankommet som forventet"
                        >
                            Ikke ankommet som forventet
                        </button>


                        <button
                            type="button"
                            class="criteria-chip"
                            data-value="Annet"
                        >
                            Annet
                        </button>

                    </div>


                    <input
                        type="hidden"
                        id="triggerCriterion"
                        name="triggerCriterion"
                    >


                    <!-- ANNET -->

                    <div
                        class="conditional-field hidden"
                        id="otherCriterionField"
                    >

                        <label for="otherCriterion">
                            Beskriv annet kriterium
                        </label>

                        <textarea
                            id="otherCriterion"
                            name="otherCriterion"
                            rows="3"
                            placeholder="Beskrivelse"
                        ></textarea>

                    </div>

                </section>


            </form>

        </div>



        <!-- =================================================
             HØYRE RAPPORTPANEL
             ================================================= -->

        <aside class="side-panel">

            <div class="side-panel-inner">


                <h2>
                    Rapporttekst
                </h2>


                <textarea
                    id="reportOutput"
                    class="report-output"
                    readonly
                    aria-label="Generert rapporttekst"
                ></textarea>



                <!-- KOPIER -->

                <div class="action-buttons">


                    <button
                        type="button"
                        id="copyReportButton"
                        class="action-button action-copy"
                    >

                        <span
                            class="button-icon"
                            aria-hidden="true"
                        >
                            📋
                        </span>

                        <span>
                            Kopier tekst
                        </span>

                    </button>


                    <div
                        id="copyConfirmation"
                        class="copy-confirmation"
                        aria-live="polite"
                    ></div>



                    <!-- TØM -->

                    <button
                        type="button"
                        id="resetFormButton"
                        class="action-button action-reset"
                    >

                        <span
                            class="button-icon"
                            aria-hidden="true"
                        >
                            🗑️
                        </span>

                        <span>
                            Tøm skjema
                        </span>

                    </button>



                    <div class="action-space"></div>



                    <!-- PROSEDYRE -->

                    <a
                        href="https://ehandbok.ous-hf.no/document/144250"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="action-button action-procedure"
                    >

                        <span
                            class="button-icon"
                            aria-hidden="true"
                        >
                            📘
                        </span>

                        <span>
                            Prosedyre savnet helikopter
                        </span>

                    </a>



                    <!-- OUTLOOK -->

                    <button
                        type="button"
                        id="emailReportButton"
                        class="action-button action-email"
                    >

                        <span
                            class="button-icon"
                            aria-hidden="true"
                        >
                            ✉️
                        </span>

                        <span>
                            Opprett Outlook e-post
                        </span>

                    </button>


                </div>

            </div>

        </aside>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="../js/savnet-helikopter.js"></script>


</body>

</html>
