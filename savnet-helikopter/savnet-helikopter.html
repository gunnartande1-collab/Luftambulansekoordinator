<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Savnet helikopter | Luftambulansekoordinator</title>

    <link
        rel="stylesheet"
        href="../css/savnet-helikopter.css"
    >
</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="app-header">

        <p class="app-eyebrow">
            Luftambulansekoordinator
        </p>

        <h1>
            <span>Savnet helikopter</span>
        </h1>

    </header>


    <!-- =====================================================
         HOVEDLAYOUT
         VENSTRE MENY | SKJEMA | RAPPORT
         ===================================================== -->

    <main class="app-shell">


        <!-- =================================================
             VENSTRE MENY
             ================================================= -->

        <nav
            class="form-navigation"
            aria-label="Skjemaer"
        >

            <div class="form-navigation-inner">

                <p class="form-navigation-label">
                    Skjemaer
                </p>

                <ul class="form-nav-list">


                    <li>

                        <a
                            href="../index.html"
                            class="form-nav-link"
                        >

                            <span
                                class="form-nav-icon"
                                aria-hidden="true"
                            >
                                🏠
                            </span>

                            <span class="form-nav-copy">
                                <span>Fremside</span>
                            </span>

                        </a>

                    </li>


                    <li>

                        <a
                            href="savnet-helikopter.html"
                            class="form-nav-link"
                            aria-current="page"
                        >

                            <span
                                class="form-nav-icon"
                                aria-hidden="true"
                            >
                                🚁
                            </span>

                            <span class="form-nav-copy">
                                <span>Savnet helikopter</span>
                            </span>

                        </a>

                    </li>


                    <li>

                        <a
                            href="gps-forstyrrelser.html"
                            class="form-nav-link"
                        >

                            <span
                                class="form-nav-icon"
                                aria-hidden="true"
                            >
                                📡
                            </span>

                            <span class="form-nav-copy">
                                <span>GPS-forstyrrelser</span>
                            </span>

                        </a>

                    </li>

                </ul>

            </div>

        </nav>



        <!-- =================================================
             SKJEMA
             ================================================= -->

        <div class="form-panel">

            <form
                id="missingHelicopterForm"
                autocomplete="off"
            >


                <!-- =========================================
                     1. TALEGRUPPER
                     ========================================= -->

                <section
                    class="form-section"
                    id="talegrupper"
                >

                    <h2>Talegrupper</h2>


                    <div class="tg-grid">


                        <div class="field-card">

                            <label for="healthTg">
                                Helse TG
                            </label>

                            <input
                                type="text"
                                id="healthTg"
                                name="healthTg"
                                placeholder="Talegruppe"
                            >

                        </div>


                        <div class="field-card">

                            <label for="sarTg">
                                SAR TG
                            </label>

                            <input
                                type="text"
                                id="sarTg"
                                name="sarTg"
                                placeholder="Talegruppe"
                            >

                        </div>


                        <div class="field-card">

                            <label>
                                Annen TG
                            </label>

                            <div id="otherTgContainer">

                                <input
                                    type="text"
                                    id="otherTgFirst"
                                    class="other-tg-input"
                                    aria-label="Annen TG"
                                    autocomplete="off"
                                >

                            </div>

                        </div>

                    </div>

                </section>



                <!-- =========================================
                     2. POSISJON
                     ========================================= -->

                <section
                    class="form-section"
                    id="posisjon"
                >

                    <h2>Posisjon</h2>


                    <div class="form-grid form-grid-2">


                        <div class="form-field">

                            <label for="utmPosition">
                                UTM
                            </label>

                            <input
                                type="text"
                                id="utmPosition"
                                name="utmPosition"
                                placeholder="Ø 123 45, N 678 90 UTM32N"
                            >

                        </div>


                        <div class="form-field">

                            <label for="dmmPosition">
                                Grader og desimalminutter
                            </label>

                            <input
                                type="text"
                                id="dmmPosition"
                                name="dmmPosition"
                                placeholder="59° 55.123' N, 10° 44.456' Ø"
                            >

                        </div>

                    </div>


                    <p
                        class="field-error"
                        id="coordinateError"
                    ></p>


                    <div class="form-field">

                        <label for="placeName">
                            Stedsnavn / område
                        </label>

                        <input
                            type="text"
                            id="placeName"
                            name="placeName"
                            placeholder="Stedsnavn eller område"
                        >

                    </div>

                </section>



                <!-- =========================================
                     3. CREX MANIFEST
                     ========================================= -->

                <section
                    class="form-section"
                    id="crex-manifest"
                >

                    <h2>CREX manifest</h2>


                    <!-- POB TOTALT -->

                    <div class="form-field crex-pob-field">

                        <span class="field-label">
                            POB – totalt
                        </span>


                        <div
                            class="chip-group"
                            id="pobChips"
                            role="group"
                            aria-label="Velg totalt antall personer om bord"
                        >

                            <button
                                type="button"
                                class="chip"
                                data-pob="1"
                                aria-pressed="false"
                            >
                                1
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="2"
                                aria-pressed="false"
                            >
                                2
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="3"
                                aria-pressed="false"
                            >
                                3
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="4"
                                aria-pressed="false"
                            >
                                4
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="5"
                                aria-pressed="false"
                            >
                                5
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="6"
                                aria-pressed="false"
                            >
                                6
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="7"
                                aria-pressed="false"
                            >
                                7
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="8"
                                aria-pressed="false"
                            >
                                8
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="9"
                                aria-pressed="false"
                            >
                                9
                            </button>

                            <button
                                type="button"
                                class="chip"
                                data-pob="10"
                                aria-pressed="false"
                            >
                                10
                            </button>

                        </div>

                    </div>



                    <!-- LUFTFARTØY-ID -->

                    <div class="form-grid form-grid-3">


                        <div class="form-field">

                            <label for="resourceId">
                                Ressurs-ID
                            </label>

                            <input
                                type="text"
                                id="resourceId"
                                name="resourceId"
                                placeholder="F.eks. LA 1-1"
                            >

                        </div>


                        <div class="form-field">

                            <label for="registration">
                                Reg.nr.
                            </label>

                            <input
                                type="text"
                                id="registration"
                                name="registration"
                                placeholder="F.eks. LN-OOA"
                            >

                        </div>


                        <div class="form-field">

                            <label for="callsign">
                                Callsign
                            </label>

                            <input
                                type="text"
                                id="callsign"
                                name="callsign"
                                placeholder="Callsign"
                            >

                        </div>

                    </div>



                    <!-- PILOT -->

                    <div class="person-row">

                        <div class="person-role">

                            <img
                                src="../img/pilot.svg"
                                alt=""
                                aria-hidden="true"
                            >

                            <span>Pilot</span>

                        </div>

                        <input
                            type="text"
                            id="pilotName"
                            name="pilotName"
                            placeholder="Navn"
                        >

                        <input
                            type="tel"
                            id="pilotPhone"
                            name="pilotPhone"
                            placeholder="Mobilnummer"
                        >

                    </div>



                    <!-- REDNINGSMANN -->

                    <div class="person-row">

                        <div class="person-role">

                            <img
                                src="../img/redningsmann.svg"
                                alt=""
                                aria-hidden="true"
                            >

                            <span>Redningsmann</span>

                        </div>

                        <input
                            type="text"
                            id="rescuerName"
                            name="rescuerName"
                            placeholder="Navn"
                        >

                        <input
                            type="tel"
                            id="rescuerPhone"
                            name="rescuerPhone"
                            placeholder="Mobilnummer"
                        >

                    </div>



                    <!-- LEGE -->

                    <div class="person-row">

                        <div class="person-role">

                            <img
                                src="../img/lege.svg"
                                alt=""
                                aria-hidden="true"
                            >

                            <span>Lege</span>

                        </div>

                        <input
                            type="text"
                            id="doctorName"
                            name="doctorName"
                            placeholder="Navn"
                        >

                        <input
                            type="tel"
                            id="doctorPhone"
                            name="doctorPhone"
                            placeholder="Mobilnummer"
                        >

                    </div>



                    <!-- PAX -->

                    <div
                        id="traineeContainer"
                        class="pax-container"
                    >

                        <div class="person-row trainee-row">

                            <div class="person-role">

                                <img
                                    src="../img/pax.svg"
                                    alt=""
                                    aria-hidden="true"
                                >

                                <span class="pax-label">
                                    PAX 1
                                </span>

                            </div>

                            <input
                                type="text"
                                class="trainee-name"
                                aria-label="PAX 1 fullt navn"
                                placeholder="Navn"
                                autocomplete="off"
                            >

                            <input
                                type="tel"
                                class="trainee-phone"
                                aria-label="PAX 1 mobilnummer"
                                placeholder="Mobilnummer"
                                autocomplete="off"
                            >

                        </div>

                    </div>

                </section>



                <!-- =========================================
                     4. FLYRUTE
                     ========================================= -->

                <section
                    class="form-section"
                    id="flyrute"
                >

                    <h2>Flyrute</h2>


                    <div class="form-grid form-grid-2">


                        <div class="form-field">

                            <label for="fromLocation">
                                Fra
                            </label>

                            <input
                                type="text"
                                id="fromLocation"
                                name="fromLocation"
                                placeholder="ICAO-kode eller sted"
                            >

                        </div>


                        <div class="form-field">

                            <label for="toLocation">
                                Til
                            </label>

                            <input
                                type="text"
                                id="toLocation"
                                name="toLocation"
                                placeholder="ICAO-kode eller sted"
                            >

                        </div>

                    </div>


                    <div class="form-field">

                        <label for="plannedRoute">
                            Beskrivelse
                        </label>

                        <textarea
                            id="plannedRoute"
                            name="plannedRoute"
                            rows="3"
                            placeholder="Beskrivelse av planlagt flyrute"
                        ></textarea>

                    </div>


                    <div class="form-grid form-grid-2">


                        <div class="form-field">

                            <label for="departureTime">
                                Tatt av
                            </label>

                            <input
                                type="text"
                                id="departureTime"
                                name="departureTime"
                                placeholder="TT:MM"
                                maxlength="8"
                                inputmode="numeric"
                            >

                        </div>


                        <div class="form-field">

                            <label for="etaTime">
                                ETA
                            </label>

                            <input
                                type="text"
                                id="etaTime"
                                name="etaTime"
                                placeholder="TT:MM"
                                maxlength="8"
                                inputmode="numeric"
                            >

                        </div>

                    </div>


                    <p
                        class="field-error"
                        id="timeError"
                    ></p>

                </section>



                <!-- =========================================
                     5. UTLØSENDE KRITERIUM
                     ========================================= -->

                <section
                    class="form-section"
                    id="utlosende-kriterium"
                >

                    <h2>Utløsende kriterium</h2>


                    <div class="criteria-list">


                        <button
                            type="button"
                            class="criteria-chip"
                            data-criterion="1"
                            aria-pressed="false"
                        >
                            Helikopteret svarer ikke på anrop eller planlagt rapportering i henhold til flight following, og vises som rød både på Locus og Nødnett.
                        </button>


                        <button
                            type="button"
                            class="criteria-chip"
                            data-criterion="2"
                            aria-pressed="false"
                        >
                            Helikopteret har ikke meldt landing innen 10 minutter etter oppgitt ETA, og det foreligger samtidig manglende kontakt eller andre indikasjoner på avvik.
                        </button>


                        <button
                            type="button"
                            class="criteria-chip"
                            data-criterion="3"
                            aria-pressed="false"
                        >
                            Observasjoner/meldinger som gir grunn til å mistenke/bekrefte havari.
                        </button>

                    </div>


                    <div
                        class="conditional-field hidden"
                        id="observationWrapper"
                    >

                        <label for="observations">
                            Observasjoner / meldinger
                        </label>

                        <textarea
                            id="observations"
                            name="observations"
                            rows="4"
                            placeholder="Beskriv observasjoner eller meldinger"
                        ></textarea>

                    </div>

                </section>


            </form>

        </div>



        <!-- =================================================
             HØYRE RAPPORTPANEL
             ================================================= -->

        <aside class="side-panel">

            <div class="side-panel-inner">


                <h2>Rapporttekst</h2>


                <textarea
                    id="reportOutput"
                    class="report-output"
                    readonly
                    aria-label="Generert rapporttekst"
                ></textarea>


                <div class="action-buttons">


                    <button
                        type="button"
                        id="copyButton"
                        class="action-button action-copy"
                    >

                        <span
                            class="button-icon"
                            aria-hidden="true"
                        >
                            📋
                        </span>

                        <span id="copyButtonText">
                            Kopier tekst
                        </span>

                    </button>


                    <div
                        id="copyConfirmation"
                        class="copy-confirmation"
                        aria-live="polite"
                    ></div>


                    <button
                        type="button"
                        id="resetButton"
                        class="action-button action-reset"
                    >

                        <span
                            class="button-icon"
                            aria-hidden="true"
                        >
                            🗑️
                        </span>

                        <span>
                            Tøm skjema
                        </span>

                    </button>


                    <div class="action-space"></div>


                    <a
                        href="https://ehandbok.ous-hf.no/document/144250"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="action-button action-procedure"
                    >

                        <span
                            class="button-icon"
                            aria-hidden="true"
                        >
                            📘
                        </span>

                        <span>
                            Prosedyre savnet helikopter
                        </span>

                    </a>


                    <button
                        type="button"
                        id="emailReportButton"
                        class="action-button action-email"
                    >

                        <span
                            class="button-icon"
                            aria-hidden="true"
                        >
                            ✉️
                        </span>

                        <span>
                            Opprett Outlook e-post
                        </span>

                    </button>


                </div>

            </div>

        </aside>


    </main>


    <script src="../js/savnet-helikopter.js"></script>


</body>

</html>
