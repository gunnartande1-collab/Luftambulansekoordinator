<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Savnet helikopter | Luftambulansekoordinator</title>

  <link rel="stylesheet" href="../felles/felles.css">
  <link rel="stylesheet" href="savnet-helikopter.css">

  <script src="../felles/felles.js" defer></script>
  <script src="../felles/meny.js" defer></script>
  <script src="savnet-helikopter.js" defer></script>
</head>

<body>
  <header class="app-header">
    <div>
      <p class="app-eyebrow">Luftambulansekoordinator</p>
      <h1>Savnet helikopter</h1>
    </div>

    <button
      type="button"
      id="themeToggle"
      class="theme-toggle"
      aria-pressed="false"
      aria-label="Slå på kveldsmodus"
    >
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle-text">Kveldsmodus</span>
    </button>
  </header>

  <main class="app-shell">

    <!-- VENSTREMENY -->
    <nav
      class="form-navigation"
      data-shared-menu
      aria-label="Skjemaer"
    >
      <div class="form-navigation-inner">
        <p class="form-navigation-label">Skjemaer</p>

        <ul class="form-nav-list">
          <li>
            <a href="../fremside.html" class="form-nav-link">
              <span class="form-nav-icon" aria-hidden="true">🏠</span>
              <span class="form-nav-copy">
                <span>Fremside</span>
              </span>
            </a>
          </li>

          <li>
            <a
              href="savnet-helikopter.html"
              class="form-nav-link"
              aria-current="page"
            >
              <span class="form-nav-icon" aria-hidden="true">🚁</span>
              <span class="form-nav-copy">
                <span>Savnet helikopter</span>
              </span>
            </a>
          </li>

          <li>
            <a
              href="../gps-forstyrrelser/gps-forstyrrelser.html"
              class="form-nav-link"
            >
              <span class="form-nav-icon" aria-hidden="true">📡</span>
              <span class="form-nav-copy">
                <span>GPS-forstyrrelser</span>
              </span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- SKJEMA MED EGET RULLEFELT -->
    <div class="form-panel-frame">
      <div
        class="form-panel"
        tabindex="0"
        role="region"
        aria-label="Skjema for savnet helikopter"
      >
        <form id="missingHelicopterForm" autocomplete="off">

          <!-- 1. TALEGRUPPER -->
          <section class="form-section" id="talegrupper">
            <h2>Talegrupper</h2>

            <div class="tg-grid">
              <div class="field-card">
                <label for="healthTg">Helse TG</label>
                <input
                  type="text"
                  id="healthTg"
                  name="healthTg"
                >
              </div>

              <div class="field-card">
                <label for="sarTg">SAR TG</label>
                <input
                  type="text"
                  id="sarTg"
                  name="sarTg"
                >
              </div>

              <div class="field-card">
                <label for="otherTgFirst">Annen TG</label>

                <div id="otherTgContainer">
                  <input
                    type="text"
                    id="otherTgFirst"
                    class="other-tg-input"
                    autocomplete="off"
                  >
                </div>
              </div>
            </div>
          </section>

          <!-- 2. POSISJON -->
          <section class="form-section" id="posisjon">
            <h2>Posisjon</h2>

            <div class="form-grid form-grid-2">
              <div class="form-field">
                <label for="utmPosition">UTM</label>
                <input
                  type="text"
                  id="utmPosition"
                  name="utmPosition"
                  aria-describedby="coordinateError"
                >
              </div>

              <div class="form-field">
                <label for="dmmPosition">
                  Grader og desimalminutter
                </label>

                <input
                  type="text"
                  id="dmmPosition"
                  name="dmmPosition"
                  aria-describedby="coordinateError"
                >
              </div>
            </div>

            <p
              id="coordinateError"
              class="field-error"
              aria-live="polite"
            ></p>

            <div class="form-field">
              <label for="placeName">Stedsnavn / område</label>
              <input
                type="text"
                id="placeName"
                name="placeName"
              >
            </div>
          </section>

          <!-- 3. CREW MANIFEST -->
          <section class="form-section" id="crew-manifest">
            <h2>Crew manifest</h2>

            <div class="form-field pob-field">
              <span class="field-label">POB – totalt</span>

              <div
                id="pobChips"
                class="chip-group"
                role="group"
                aria-label="Totalt antall personer om bord"
              >
                <button type="button" class="chip" data-pob="1" aria-pressed="false">1</button>
                <button type="button" class="chip" data-pob="2" aria-pressed="false">2</button>
                <button type="button" class="chip" data-pob="3" aria-pressed="false">3</button>
                <button type="button" class="chip" data-pob="4" aria-pressed="false">4</button>
                <button type="button" class="chip" data-pob="5" aria-pressed="false">5</button>
                <button type="button" class="chip" data-pob="6" aria-pressed="false">6</button>
                <button type="button" class="chip" data-pob="7" aria-pressed="false">7</button>
                <button type="button" class="chip" data-pob="8" aria-pressed="false">8</button>
                <button type="button" class="chip" data-pob="9" aria-pressed="false">9</button>
                <button type="button" class="chip" data-pob="10" aria-pressed="false">10</button>
              </div>
            </div>

            <div class="form-grid form-grid-3">
              <div class="form-field">
                <label for="resourceId">Ressurs-ID</label>
                <input
                  type="text"
                  id="resourceId"
                  name="resourceId"
                >
              </div>

              <div class="form-field">
                <label for="registration">Reg.nr.</label>
                <input
                  type="text"
                  id="registration"
                  name="registration"
                >
              </div>

              <div class="form-field">
                <label for="callsign">Callsign</label>
                <input
                  type="text"
                  id="callsign"
                  name="callsign"
                >
              </div>
            </div>

            <!-- PILOT -->
            <div class="person-row">
              <div class="person-role">
                <img
                  src="../img/pilot.svg"
                  class="person-ikon"
                  alt=""
                  aria-hidden="true"
                >
                <span>Pilot</span>
              </div>

              <textarea
                rows="1"
                id="pilotName"
                name="pilotName"
                class="crew-name"
                placeholder="Navn"
                aria-label="Pilot navn"
              ></textarea>

              <input
                type="tel"
                id="pilotPhone"
                name="pilotPhone"
                placeholder="Mobilnummer"
                aria-label="Pilot mobilnummer"
              >
            </div>

            <!-- HCM / PCM -->
            <div class="person-row">
              <div class="person-role">
                <img
                  src="../img/redningsmann.svg"
                  class="person-ikon"
                  alt=""
                  aria-hidden="true"
                >

                <span
                  id="rescuerRole"
                  title="Helicopter Crew Member (HCM)"
                >HCM</span>
              </div>

              <textarea
                rows="1"
                id="rescuerName"
                name="rescuerName"
                class="crew-name"
                placeholder="Navn"
                aria-label="HCM navn"
              ></textarea>

              <input
                type="tel"
                id="rescuerPhone"
                name="rescuerPhone"
                placeholder="Mobilnummer"
                aria-label="HCM mobilnummer"
              >
            </div>

            <!-- LEGE / PCM -->
            <div class="person-row">
              <div class="person-role">
                <img
                  src="../img/lege.svg"
                  class="person-ikon"
                  alt=""
                  aria-hidden="true"
                >
                <span id="doctorRole">Lege</span>
              </div>

              <textarea
                rows="1"
                id="doctorName"
                name="doctorName"
                class="crew-name"
                placeholder="Navn"
                aria-label="Lege navn"
              ></textarea>

              <input
                type="tel"
                id="doctorPhone"
                name="doctorPhone"
                placeholder="Mobilnummer"
                aria-label="Lege mobilnummer"
              >
            </div>

            <!-- PAX -->
            <div id="traineeContainer">
              <div class="person-row trainee-row">
                <div class="person-role">
                  <span class="role-icon" aria-hidden="true">👤</span>
                  <span class="pax-label">PAX 1</span>
                </div>

                <textarea
                  rows="1"
                  class="trainee-name crew-name"
                  aria-label="PAX 1 navn"
                  placeholder="Navn"
                  autocomplete="off"
                ></textarea>

                <input
                  type="tel"
                  class="trainee-phone"
                  aria-label="PAX 1 mobilnummer"
                  placeholder="Mobilnummer"
                  autocomplete="off"
                >
              </div>
            </div>
          </section>

          <!-- 4. FLYRUTE -->
          <section class="form-section" id="flyrute">
            <h2>Flyrute</h2>

            <div class="form-grid form-grid-2">
              <div class="form-field">
                <label for="fromLocation">Fra</label>
                <input
                  type="text"
                  id="fromLocation"
                  name="fromLocation"
                >
              </div>

              <div class="form-field">
                <label for="toLocation">Til</label>
                <input
                  type="text"
                  id="toLocation"
                  name="toLocation"
                >
              </div>
            </div>

            <div class="form-field">
              <label for="plannedRoute">Beskrivelse</label>
              <textarea
                id="plannedRoute"
                name="plannedRoute"
                rows="3"
              ></textarea>
            </div>

            <div class="form-grid form-grid-2">
              <div class="form-field">
                <label for="departureTime">Tatt av</label>
                <input
                  type="text"
                  id="departureTime"
                  name="departureTime"
                  maxlength="8"
                  inputmode="numeric"
                  aria-describedby="timeError"
                >
              </div>

              <div class="form-field">
                <label for="etaTime">ETA</label>
                <input
                  type="text"
                  id="etaTime"
                  name="etaTime"
                  maxlength="8"
                  inputmode="numeric"
                  aria-describedby="timeError"
                >
              </div>
            </div>

            <p
              id="timeError"
              class="field-error"
              aria-live="polite"
            ></p>
          </section>

          <!-- 5. UTLØSENDE KRITERIUM -->
          <section class="form-section" id="utlosende-kriterium">
            <h2>Utløsende kriterium</h2>

            <div
              class="criteria-list"
              role="group"
              aria-label="Velg utløsende kriterium"
            >
              <button
                type="button"
                class="criteria-chip"
                data-criterion="1"
                aria-pressed="false"
              >
                Manglende kontakt og rød på både Locus og Nødnett.
              </button>

              <button
                type="button"
                class="criteria-chip"
                data-criterion="2"
                aria-pressed="false"
              >
                Ingen landingsmelding 10 minutter etter ETA,
                samtidig manglende kontakt eller tegn til avvik.
              </button>

              <button
                type="button"
                class="criteria-chip"
                data-criterion="3"
                aria-pressed="false"
                aria-controls="observationWrapper"
                aria-expanded="false"
              >
                Observasjoner/meldinger som gir grunn til å mistenke
                eller bekrefte havari.
              </button>
            </div>

            <div
              id="observationWrapper"
              class="conditional-field hidden"
            >
              <label for="observations">
                Observasjoner / meldinger
              </label>

              <textarea
                id="observations"
                name="observations"
                rows="4"
                placeholder="Beskriv observasjoner eller meldinger"
              ></textarea>
            </div>
          </section>

        </form>
      </div>

      <button
        type="button"
        id="formScrollHint"
        class="form-scroll-hint"
        hidden
        aria-label="Rull videre ned i skjemaet"
      >
        Mer av skjemaet ↓
      </button>
    </div>

    <!-- RAPPORT -->
    <aside class="side-panel" aria-label="Rapport og handlinger">
      <div class="side-panel-inner">
        <h2>Rapporttekst</h2>

        <textarea
          id="reportOutput"
          class="report-output"
          readonly
          aria-label="Generert rapporttekst"
        ></textarea>

        <div class="action-buttons">
          <button
            type="button"
            id="copyButton"
            class="action-button action-copy"
          >
            <span aria-hidden="true">📋</span>

            <span
              id="copyButtonText"
              role="status"
              aria-live="polite"
            >Kopier tekst</span>
          </button>

          <button
            type="button"
            id="resetButton"
            class="action-button action-reset"
          >
            <span aria-hidden="true">🗑️</span>
            <span>Tøm skjema</span>
          </button>

          <div class="action-space" aria-hidden="true"></div>

          <a
            href="https://ehandbok.ous-hf.no/document/144250"
            target="_blank"
            rel="noopener noreferrer"
            class="action-button action-procedure"
          >
            <span aria-hidden="true">📘</span>
            <span>Prosedyre savnet helikopter</span>
          </a>

          <button
            type="button"
            id="emailReportButton"
            class="action-button action-email"
          >
            <span aria-hidden="true">✉️</span>
            <span>Tilbakemelding på skjema</span>
          </button>
        </div>
      </div>
    </aside>

  </main>
</body>
</html>
