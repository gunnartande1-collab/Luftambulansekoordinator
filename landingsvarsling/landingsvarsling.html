
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Landingsvarsel Redningshelikopter | Luftambulansekoordinator</title>

  <!-- FELLES DESIGN -->
  <link
    rel="stylesheet"
    href="../felles/felles.css"
  >

  <!-- LANDINGSVARSEL DESIGN -->
  <link
    rel="stylesheet"
    href="landingsvarsling.css"
  >

  <!-- FELLES FUNKSJONER OG TOPPFELT -->
  <script
    src="../felles/felles.js"
    defer
  ></script>

  <!-- LANDINGSVARSEL -->
  <script
    src="landingsvarsling.js"
    defer
  ></script>
</head>

<body
  class="landingsvarsel-side"
  data-page-title=" "
>
  <!-- FELLES TOPPFELT -->
  <!-- Bygges automatisk av felles.js -->

  <header class="app-header"></header>


  <!-- HOVEDINNHOLD -->

  <main class="lv-app">

    <!-- NEDTELLINGSKLOKKE -->

    <section
      class="lv-timer-card"
      aria-label="Nedtellingsklokke"
    >

      <p class="lv-timer-label">
        TID TIL FORVENTET LANDING
      </p>

      <div
        id="timerDisplay"
        class="lv-timer"
        role="timer"
        aria-label="Tid til landing"
      >
        03:00
      </div>


      <!-- FREMGANGSLINJE -->

      <div
        class="lv-progress"
        role="progressbar"
        aria-label="Nedtellingens fremdrift"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >

        <div
          id="progressBar"
          class="lv-progress-fill"
        ></div>

      </div>


      <!-- TIDSMARKØRER -->

      <div class="lv-markers">

        <span>03:00 Start</span>

        <span>01:30 Varsling</span>

        <span>00:00 Landing</span>

      </div>


      <!-- ALARM VED 01:30 -->

      <div
        id="alarmMessage"
        class="lv-alarm-message"
        role="alert"
        hidden
      >

        <span
          class="lv-alarm-icon"
          aria-hidden="true"
        >
          🔔
        </span>

        <strong>
          AKTIVER LANDINGSVARSEL!
        </strong>

      </div>


      <!-- KVITTERING -->

      <button
        id="ackButton"
        type="button"
        class="lv-ack-button"
        hidden
      >
        ✓ Varsling aktivert
      </button>

    </section>


    <!-- HOVEDKNAPPER -->

    <div class="lv-actions">

      <button
        id="startButton"
        type="button"
        class="lv-button lv-button-primary"
      >
        ▶ Start
      </button>

      <button
        id="resetButton"
        type="button"
        class="lv-button lv-button-secondary"
      >
        ↺ Nullstill
      </button>

    </div>


    <!-- LYDTEST -->

    <footer class="lv-footer">

      <button
        id="testSoundButton"
        type="button"
        class="lv-text-button"
      >
        Test lyd
      </button>

    </footer>

  </main>

</body>
</html>
