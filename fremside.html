<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luftambulansekoordinator</title>

  <link rel="stylesheet" href="felles/felles.css">
  <script src="felles/felles.js" defer></script>

  <style>
    :root {
      --background: #eef2f5;
      --surface: #ffffff;
      --text: #17212b;
      --muted: #667085;
      --border: #dce2e8;
      --primary: #0066a1;
      --primary-light: #eaf5fb;
      --hover-surface: #f3f6f8;
      --active-border: #c5e1f1;
      --button-background: #0066a1;
      --button-hover: #004f7c;
      --unavailable-background: #f0f3f5;
      --sidebar-width: 240px;

      color-scheme: light;
    }

    html[data-theme="dark"] {
      --background: #111820;
      --surface: #1b2530;
      --text: #e7edf4;
      --muted: #a9b5c3;
      --border: #344252;
      --primary: #70bce8;
      --primary-light: #243f55;
      --hover-surface: #263444;
      --active-border: #48799a;
      --button-background: #275b7b;
      --button-hover: #34769b;
      --unavailable-background: #26323f;

      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 4px;
    }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--button-background);
      color: #ffffff;
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    /* OVERSKRIFT OG MODUSKNAPP */

    .app-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      width: 100%;
      height: auto;
      min-height: 90px;
      padding: 22px 28px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .app-header h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .app-header .theme-toggle {
      position: static;
      top: auto;
      right: auto;
      transform: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      gap: 8px;

      min-height: 38px;
      padding: 8px 12px;

      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);

      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .app-header .theme-toggle:hover {
      background: var(--hover-surface);
      filter: none;
    }

    /* VENSTREMENY OG HOVEDINNHOLD */

    .app-layout {
      display: grid;
      grid-template-columns:
        var(--sidebar-width)
        minmax(0, 1fr);
      min-height: calc(100vh - 90px);
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .sidebar-inner {
      position: sticky;
      top: 0;
      padding: 24px 16px;
    }

    .navigation-label {
      margin: 22px 12px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .nav-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 11px 12px;

      border: 1px solid transparent;
      border-radius: 9px;

      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    a.nav-link:hover {
      background: var(--hover-surface);
      border-color: var(--border);
    }

    .nav-link[aria-current="page"] {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--active-border);
    }

    .nav-link.is-unavailable {
      color: var(--muted);
    }

    .nav-icon {
      width: 23px;
      flex: 0 0 23px;
      text-align: center;
      font-size: 19px;
    }

    .nav-copy {
      display: grid;
      gap: 2px;
    }

    .nav-status {
      font-size: 11px;
      font-weight: 400;
    }

    /* SKJEMAKORT */

    .main-content {
      width: 100%;
      max-width: 1250px;
      min-width: 0;
      padding: 38px;
    }

    .page-heading {
      margin-bottom: 26px;
    }

    .page-heading h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .page-heading p {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
    }

    .form-cards {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      align-items: stretch;
      gap: 20px;
    }

    .form-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 26px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--surface);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .card-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 48px;
      height: 48px;
      margin-bottom: 20px;

      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 27px;
    }

    .form-card h3 {
      margin: 0 0 9px;
      font-size: 20px;
    }

    .form-card p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      min-height: 44px;
      margin-top: auto;
      padding: 10px 17px;

      border-radius: 8px;
      background: var(--button-background);
      color: #ffffff;

      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    a.card-action:hover {
      background: var(--button-hover);
    }

    .card-action.is-unavailable {
      background: var(--unavailable-background);
      color: var(--muted);
    }

    .page-footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 12px;
    }

    /* NETTBRETT OG MOBIL */

    @media (max-width: 900px) {
      :root {
        --sidebar-width: 210px;
      }

      .main-content {
        padding: 26px;
      }
    }

    @media (max-width: 650px) {
      .app-header {
        gap: 12px;
        padding: 18px;
      }

      .app-header h1 {
        font-size: 22px;
      }

      .app-header .theme-toggle {
        gap: 5px;
        padding: 7px 9px;
        font-size: 12px;
      }

      .app-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-inner {
        position: static;
        padding: 12px;
      }

      .navigation-label {
        margin: 14px 12px 8px;
      }

      .nav-list {
        grid-template-columns:
          repeat(auto-fit, minmax(150px, 1fr));
      }

      .main-content {
        padding: 24px 16px;
      }

      .page-heading h2 {
        font-size: 24px;
      }

      .form-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#mainContent">
    Gå til hovedinnhold
  </a>

  <header class="app-header">
    <h1>Luftambulansekoordinator</h1>

    <button
      type="button"
      id="themeToggle"
      class="theme-toggle"
      aria-pressed="false"
      aria-label="Slå på kveldsmodus"
    >
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      <span class="theme-toggle-text">Kveldsmodus</span>
    </button>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <nav aria-label="Hovedmeny">
          <a
            class="nav-link"
            href="fremside.html"
            aria-current="page"
          >
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span>Hjem</span>
          </a>

          <p class="navigation-label">Skjemaer</p>

          <ul class="nav-list" id="formNavigation"></ul>
        </nav>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <div class="page-heading">
        <h2>Skjemaer</h2>
        <p>Velg skjema for hendelsen du skal dokumentere.</p>
      </div>

      <div class="form-cards" id="formCards"></div>

      <noscript>
        <p>
          <a href="savnet-helikopter/savnet-helikopter.html">
            Åpne skjema for savnet helikopter
          </a>
        </p>
      </noscript>

      <footer class="page-footer">
        Luftambulansekoordinator
      </footer>
    </main>
  </div>

  <script>
    (() => {
      const FORMS = [
        {
          title: "Savnet helikopter",
          description:
            "Registrer siste kjente posisjon, flyrute, " +
            "utløsende kriterium og personer om bord.",
          href: "savnet-helikopter/savnet-helikopter.html",
          icon: "✈",
          available: true
        },
        {
          title: "GPS-forstyrrelser",
          description:
            "Registrer tidspunkt, posisjon, høyde, " +
            "luftfartøy og beskrivelse av forstyrrelsen.",
          href: "gps-forstyrrelser/gps-forstyrrelser.html",
          icon: "⌖",
          available: false
        }
      ];

      const navigation = document.getElementById("formNavigation");
      const cards = document.getElementById("formCards");

      FORMS.forEach((form) => {
        const listItem = document.createElement("li");
        const navItem = document.createElement(
          form.available ? "a" : "span"
        );

        navItem.className = "nav-link";

        if (form.available) {
          navItem.href = form.href;
        } else {
          navItem.classList.add("is-unavailable");
        }

        const navIcon = document.createElement("span");
        navIcon.className = "nav-icon";
        navIcon.setAttribute("aria-hidden", "true");
        navIcon.textContent = form.icon;

        const navCopy = document.createElement("span");
        navCopy.className = "nav-copy";

        const navTitle = document.createElement("span");
        navTitle.textContent = form.title;
        navCopy.appendChild(navTitle);

        if (!form.available) {
          const status = document.createElement("span");
          status.className = "nav-status";
          status.textContent = "Kommer";
          navCopy.appendChild(status);
        }

        navItem.append(navIcon, navCopy);
        listItem.appendChild(navItem);
        navigation.appendChild(listItem);

        const card = document.createElement("article");
        card.className = "form-card";

        const cardIcon = document.createElement("span");
        cardIcon.className = "card-icon";
        cardIcon.setAttribute("aria-hidden", "true");
        cardIcon.textContent = form.icon;

        const title = document.createElement("h3");
        title.textContent = form.title;

        const description = document.createElement("p");
        description.textContent = form.description;

        const action = document.createElement(
          form.available ? "a" : "span"
        );

        action.className = "card-action";

        if (form.available) {
          action.href = form.href;
          action.setAttribute(
            "aria-label",
            "Åpne skjema: " + form.title
          );

          const text = document.createElement("span");
          text.textContent = "Åpne skjema";

          const arrow = document.createElement("span");
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "→";

          action.append(text, arrow);
        } else {
          action.classList.add("is-unavailable");
          action.textContent = "Kommer";
        }

        card.append(cardIcon, title, description, action);
        cards.appendChild(card);
      });
    })();
  </script>
</body>
</html>
