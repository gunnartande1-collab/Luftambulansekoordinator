<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luftambulansekoordinator</title>

    <style>
        :root {
            --background: #eef2f5;
            --surface: #ffffff;
            --text: #17212b;
            --muted: #667085;
            --border: #dce2e8;
            --primary: #0066a1;
            --primary-light: #eaf5fb;
            --sidebar-width: 240px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.5;
        }

        a {
            color: inherit;
        }

        button,
        input {
            font: inherit;
        }

        a:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 4px;
        }

        .skip-link {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 10px 16px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            transform: translateY(-160%);
        }

        .skip-link:focus {
            transform: translateY(0);
        }

        /* Felles overskrift */

        .app-header {
            padding: 22px 28px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .app-eyebrow {
            margin: 0 0 4px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .app-header h1 {
            margin: 0;
            font-size: 25px;
        }

        /* Venstremeny og hovedinnhold */

        .app-layout {
            display: grid;
            grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
            min-height: calc(100vh - 105px);
        }

        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
        }

        .sidebar-inner {
            position: sticky;
            top: 0;
            padding: 24px 16px;
        }

        .navigation-label {
            margin: 22px 12px 10px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .nav-list {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 11px 12px;
            border: 1px solid transparent;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        a.nav-link:hover {
            background: #f3f6f8;
            border-color: var(--border);
        }

        .nav-link[aria-current="page"] {
            background: var(--primary-light);
            color: var(--primary);
            border-color: #c5e1f1;
        }

        .nav-link.is-unavailable {
            color: var(--muted);
        }

        .nav-icon {
            width: 23px;
            flex: 0 0 23px;
            text-align: center;
            font-size: 19px;
        }

        .nav-copy {
            display: grid;
            gap: 2px;
        }

        .nav-status {
            font-size: 11px;
            font-weight: 400;
        }

        /* Forside */

        .main-content {
            width: 100%;
            max-width: 1250px;
            padding: 38px;
            min-width: 0;
        }

        .page-heading {
            margin-bottom: 26px;
        }

        .page-heading h2 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .page-heading p {
            margin: 0;
            color: var(--muted);
            max-width: 650px;
        }

        .form-cards {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(min(100%, 280px), 1fr)
            );
            align-items: stretch;
            gap: 20px;
        }

        .form-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 26px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .card-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 27px;
        }

        .form-card h3 {
            margin: 0 0 9px;
            font-size: 20px;
        }

        .form-card p {
            margin: 0 0 24px;
            color: var(--muted);
        }

        .card-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 44px;
            margin-top: auto;
            padding: 10px 17px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        a.card-action:hover {
            background: #004f7c;
        }

        .card-action.is-unavailable {
            background: #f0f3f5;
            color: var(--muted);
        }

        .page-footer {
            margin-top: 32px;
            color: var(--muted);
            font-size: 12px;
        }

        /* Nettbrett og mobil */

        @media (max-width: 900px) {
            :root {
                --sidebar-width: 210px;
            }

            .main-content {
                padding: 26px;
            }
        }

        @media (max-width: 650px) {
            .app-header {
                padding: 18px;
            }

            .app-header h1 {
                font-size: 22px;
            }

            .app-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            .sidebar-inner {
                position: static;
                padding: 12px;
            }

            .navigation-label {
                margin: 14px 12px 8px;
            }

            .nav-list {
                grid-template-columns: repeat(
                    auto-fit,
                    minmax(150px, 1fr)
                );
            }

            .main-content {
                padding: 24px 16px;
            }

            .page-heading h2 {
                font-size: 24px;
            }

            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#mainContent">Gå til hovedinnhold</a>

    <header class="app-header">
        <p class="app-eyebrow">Operativt verktøy</p>
        <h1>Luftambulansekoordinator</h1>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-inner">
                <nav aria-label="Hovedmeny">
                    <a
                        class="nav-link"
                        href="fremside.html"
                        aria-current="page"
                    >
                        <span class="nav-icon" aria-hidden="true">⌂</span>
                        <span>Hjem</span>
                    </a>

                    <p class="navigation-label">Skjemaer</p>

                    <ul class="nav-list" id="formNavigation"></ul>
                </nav>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="page-heading">
                <h2>Skjemaer</h2>
                <p>
                    Velg skjema for hendelsen du skal dokumentere.
                </p>
            </div>

            <div class="form-cards" id="formCards"></div>

            <noscript>
                <p>
                    <a href="savnet-helikopter/savnet-helikopter.html">

                    </a>
                        Åpne skjema for savnet helikopter
                    </a>
                </p>
            </noscript>

            <footer class="page-footer">
                Luftambulansekoordinator
            </footer>
        </main>
    </div>

    <script>
        /*
         * Legg til nye skjemaer i denne listen.
         * Listen brukes både i venstremenyen og på forsiden.
         *
         * available: true  = siden er klar og kan åpnes
         * available: false = viser «Kommer», uten aktiv lenke
         */

        const FORMS = [
            {
                title: "Savnet helikopter",
                description:
                    "Registrer siste kjente posisjon, flyrute, " +
                    "utløsende kriterium og personer om bord.",
                href: "savnet-helikopter/savnet-helikopter.html",
                icon: "✈",
                available: true
            },
            {
                title: "GPS-forstyrrelser",
                description:
                    "Registrer tidspunkt, posisjon, høyde, " +
                    "luftfartøy og beskrivelse av forstyrrelsen.",
                href: "gps-forstyrrelser/gps-forstyrrelser.html",
                icon: "⌖",
                available: false
            }
        ];

        const navigation = document.getElementById("formNavigation");
        const cards = document.getElementById("formCards");

        FORMS.forEach((form) => {
            /* Venstremeny */

            const listItem = document.createElement("li");

            const navItem = document.createElement(
                form.available ? "a" : "span"
            );

            navItem.className = "nav-link";

            if (form.available) {
                navItem.href = form.href;
            } else {
                navItem.classList.add("is-unavailable");
            }

            const navIcon = document.createElement("span");
            navIcon.className = "nav-icon";
            navIcon.setAttribute("aria-hidden", "true");
            navIcon.textContent = form.icon;

            const navCopy = document.createElement("span");
            navCopy.className = "nav-copy";

            const navTitle = document.createElement("span");
            navTitle.textContent = form.title;

            navCopy.appendChild(navTitle);

            if (!form.available) {
                const status = document.createElement("span");
                status.className = "nav-status";
                status.textContent = "Kommer";
                navCopy.appendChild(status);
            }

            navItem.append(navIcon, navCopy);
            listItem.appendChild(navItem);
            navigation.appendChild(listItem);

            /* Kort på forsiden */

            const card = document.createElement("article");
            card.className = "form-card";

            const cardIcon = document.createElement("span");
            cardIcon.className = "card-icon";
            cardIcon.setAttribute("aria-hidden", "true");
            cardIcon.textContent = form.icon;

            const title = document.createElement("h3");
            title.textContent = form.title;

            const description = document.createElement("p");
            description.textContent = form.description;

            const action = document.createElement(
                form.available ? "a" : "span"
            );

            action.className = "card-action";

            if (form.available) {
                action.href = form.href;
                action.setAttribute(
                    "aria-label",
                    "Åpne skjema: " + form.title
                );

                const text = document.createElement("span");
                text.textContent = "Åpne skjema";

                const arrow = document.createElement("span");
                arrow.setAttribute("aria-hidden", "true");
                arrow.textContent = "→";

                action.append(text, arrow);
            } else {
                action.classList.add("is-unavailable");
                action.textContent = "Kommer";
            }

            card.append(cardIcon, title, description, action);
            cards.appendChild(card);
        });
    </script>
</body>
</html>
